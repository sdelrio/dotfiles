onboarding = false
[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical    = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[keys.indexed]
#workspaces = "ctrl"
#agents = "ctrl+shift"

[[keys.command]]
key= "prefix+ctrl+g"
type = "shell"
command = "herdr pane run \"$(herdr tab create --focus --label 'lazygit -' | jq -r .result.root_pane.pane_id)\" '/usr/bin/env lazygit; exit'"
description = "lazygit"

[[keys.command]]
key= "prefix+ctrl+c"
type = "popup"
command = "zsh"
width="90%"
height="85%"
description = "floating shell popu"

[[keys.command]]
key= "prefix+ctrl+r"
type = "popup"
command = "pet exec --color"
width="85%"
height="85%"
description = "pet snippets popup"

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", {token = "terminal_title_stripped", dim = false, fg= "#aba0a0"}],
  [{token = "workspace", dim = true, bold = false}]
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [ "branch", "git_status"],
]

